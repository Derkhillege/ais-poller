[project]
name = "ais-poller"
version = "0.1.0"
description = "For polling sockets and parsing them into flat vessel records."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Derk Hillege", email = "derkhillege@protonmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ais", "euris", "vessel", "websocket", "ndjson"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "python-dotenv>=1.2.2",
    "websockets>=16.0",
]

[project.scripts]
ais-poller = "ais_poller.cli:main"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ais-poller]
# Single source for the copyright year in the GPL notices (CLI notice and file headers).
copyright-year = "2026"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_poller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs against the full data.json test set (select with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
